# Copy to env.yaml (which is git-ignored), fill in the values, then run scripts/deploy.sh.
# For production, keep these in Secret Manager instead (see README, "Going further").
GOOGLE_CLOUD_PROJECT: "your-project-id"
PUBSUB_TOPIC: "lead-events"
GEMINI_API_KEY: "paste-your-key-from-google-ai-studio"
# Optional: GEMINI_MODEL: "gemini-3.8-flash"
INGEST_TOKEN: "make-up-a-long-random-string"
TELEGRAM_WEBHOOK_SECRET: "make-up-another-long-random-string"
# Optional: lets the bot send the consent notice and a fixed thank-you.
TELEGRAM_BOT_TOKEN: ""
# WhatsApp (optional, see README): leave empty to keep the webhook closed.
WHATSAPP_VERIFY_TOKEN: ""
WHATSAPP_APP_SECRET: ""
